project:
  type: website

filters:
  - etale.lua

website:
  # General Site Info (Generalized for future math topics)
  title: "Math Notes"
  site-url: "https://losergh.github.io/note/"
  description: "Personal study notes on mathematics, currently focusing on Algebraic Geometry, Positivity, and Algebraic Groups."
  page-navigation: true
  reader-mode: true

  # Search Configuration
  search:
    location: sidebar
    type: overlay

  # GitHub Repository Links
  repo-url: "https://github.com/Losergh/note"
  repo-actions: [edit, source, issue]

  # Top Navigation Bar
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
    right:
      - icon: github
        href: "https://github.com/Losergh/note"
        aria-label: GitHub

  # Dedicated Sidebars for Each Topic
  sidebar:
    - id: ag-sidebar
      title: "Algebraic Geometry"
      style: docked
      collapse-level: 2
      contents:
        - href: 16_ag/index.qmd
          text: "Overview"

    - id: positivity-sidebar
      title: "Positivity"
      style: docked
      collapse-level: 2
      contents:
        - href: 22_positivity/index.qmd
          text: "Overview"

    - id: alg-groups-sidebar
      title: "Algebraic Groups"
      style: docked
      collapse-level: 2
      contents:
        auto: 23_algebraic_groups

    # Future topic sidebars can be added here, e.g.:
    # - id: cft-sidebar
    #   title: "Class Field Theory"
    #   style: docked
    #   contents:
    #     - href: cft/index.qmd
    #       text: "Overview"

    - id: home-sidebar
      title: "Math Notes"
      style: docked
      contents:
        - href: index.qmd
          text: "Welcome"
        - section: "Topics"
          contents:
            - href: 16_ag/index.qmd
              text: "Algebraic Geometry"
            - href: 22_positivity/index.qmd
              text: "Positivity"
            - href: 23_algebraic_groups/index.qmd
              text: "Algebraic Groups"
        # 顺便把根目录下原作者留下的编辑指南也挂上（方便自己查公式排版）
        - href: editing.qmd
          text: "Typography"
  
  page-footer:
    left: "An evolving notebook on mathematics."
    right: "Built with Quarto and GitHub Pages."

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true

execute:
  freeze: auto

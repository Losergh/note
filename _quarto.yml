project:
  type: website

filters:
  - etale.lua
  - _filters/theorem-toc.lua

website:
  # General Site Info (Generalized for future math topics)
  title: "Math Notes"
  favicon: image/1.png
  site-url: "https://losergh.github.io/note/"
  description: "Personal study notes on mathematics, currently focusing on Algebraic Geometry, Positivity, and Algebraic Groups."
  page-navigation: true
  reader-mode: false
  

  # Search Configuration
  search:
    location: sidebar
    type: overlay


  # Top Navigation Bar
  navbar:
    pinned: true   
    background: primary
    right:
      - icon: github
        href: "https://github.com/Losergh/note"
        aria-label: GitHub

  # Dedicated Sidebars for Each Topic
  sidebar:
    - id: ag-sidebar
      title: "Algebraic Geometry"
      style: docked
      collapse-level: 2
      contents:
        - href: 16_ag/index.qmd
          text: "Overview"

    - id: positivity-sidebar
      title: "Positivity"
      style: docked
      collapse-level: 2
      contents:
        auto: 22_positivity
    
    - id: alg-groups-sidebar
      title: "Algebraic Groups"
      style: docked
      collapse-level: 2
      contents:
        auto: 23_algebraic_groups

    - id: mmp-sidebar
      title: "Minimal Model Program"
      style: docked
      collapse-level: 2
      contents:
        auto: 26_mmp 

    # Future topic sidebars can be added here, e.g.:
    # - id: cft-sidebar
    #   title: "Class Field Theory"
    #   style: docked
    #   contents:
    #     - href: cft/index.qmd
    #       text: "Overview"

    - id: home-sidebar
      title: "Math Notes"
      style: docked
      contents:
        - href: index.qmd
          text: "Welcome"
        - section: "Topics"
          contents:
            - href: 16_ag/index.qmd
              text: "Algebraic Geometry"
            - href: 22_positivity/index.qmd
              text: "Positivity"
            - href: 23_algebraic_groups/index.qmd
              text: "Algebraic Groups"
            - href: 26_mmp/index.qmd
              text: "Minimal Model Program"
        # 顺便把根目录下原作者留下的编辑指南也挂上（方便自己查公式排版）
        - href: editing.qmd
          text: "Typography"


format:
  html:
    grid:
      sidebar-width: 195px    # 左侧边栏宽度（默认 250px）
      margin-width: 130px     # 右侧边栏宽度：容纳「Thm 22.5.10」与中文小节标题不折行
      body-width: 1200px
      gutter-width: 1.2rem    # 侧边栏与正文的间隔（默认 1.5rem）
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true
    template-partials:
      - _partials/toc.html
    include-in-header:
      text: |
        <script>
        // MathJax 默认不加载 mathtools：\xleftrightarrow、\xLeftrightarrow、
        // \coloneqq 等命令需要它，这里显式加载（必须在 tex-chtml.js 之前执行）。
        // 另外为 MathJax 缺失的 amssymb 长钩箭头补充定义（\hookrightarrow 有，长版本没有）。
        window.MathJax = {
          loader: { load: ['[tex]/mathtools'] },
          tex: {
            packages: { '[+]': ['mathtools'] },
            macros: {
              longhookrightarrow: "\\xhookrightarrow{\\phantom{\\to}}",
              longhookleftarrow: "\\xhookleftarrow{\\phantom{\\to}}"
            }
          }
        };
        </script>
    include-after-body: thm-toc.html
execute:
  freeze: auto



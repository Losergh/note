<!-- =========================================================================
     Quarto 数学定理全功能套件 (math-support.html)
     - 修复：右侧点击原生平滑直达（避开导航栏）
     - 修复：Remark 坚决不折叠、常驻展开
     - 保留：缩小版 On this page、深色系、8px 圆角透明卡片
     ========================================================================= -->
<style>
/* --------------------------------------------------------------------------
   1. 缩小右侧大纲标题 "On this page"
   -------------------------------------------------------------------------- */
#toc-title,
h2#toc-title,
nav#TOC h2,
.sidebar .toc-title {
  font-size: 0.82rem !important;
  font-weight: 600 !important;
  letter-spacing: 0.05em !important;
  color: #64748b !important;
  text-transform: uppercase !important;
  margin-top: 0.3rem !important;
  margin-bottom: 0.6rem !important;
  padding-left: 0.2rem !important;
}

/* --------------------------------------------------------------------------
   2. 定理环境基础外观：深色竖线 + 8px 精致圆角 + 无底色透明
   -------------------------------------------------------------------------- */
.theorem {
  margin: 1.25rem 0 !important;
  padding: 0 !important;
  background: transparent !important;
  background-color: transparent !important;
  border-radius: 8px !important;
  border: 1px solid rgba(0, 0, 0, 0.08) !important;
  border-left: 5px solid #1e40af !important;
  overflow: hidden !important;
  transition: all 0.2s ease;
}

@media (prefers-color-scheme: dark) {
  .theorem, .proof {
    border-color: rgba(255, 255, 255, 0.12) !important;
  }
}

.theorem-header {
  user-select: none;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 0.55rem 0.95rem !important;
  font-weight: 700 !important;
  font-size: 1.05rem !important;
  line-height: 1.4 !important;
  background: transparent !important;
}
.theorem-header.is-clickable {
  cursor: pointer !important;
}
.theorem-header.is-clickable:hover {
  opacity: 0.82;
}

.theorem-body {
  padding: 0.35rem 0.95rem 0.75rem !important;
  background: transparent !important;
}
.theorem.is-folded .theorem-body {
  display: none !important;
}

.fold-chevron {
  display: inline-flex;
  align-items: center;
  margin-left: 0.75rem;
  opacity: 0.7;
  transition: transform 0.25s ease;
}
.theorem-header:hover .fold-chevron, .proof-header:hover .fold-chevron {
  opacity: 1;
}
.theorem.is-folded .fold-chevron, .proof.is-folded .fold-chevron {
  transform: rotate(-90deg);
}

/* --------------------------------------------------------------------------
   3. 专业深色学术色彩映射
   -------------------------------------------------------------------------- */
.theorem.kind-definition { border-left-color: #1e40af !important; }
.theorem.kind-definition > .theorem-header { color: #1e40af !important; }

.theorem.kind-lemma { border-left-color: #166534 !important; }
.theorem.kind-lemma > .theorem-header { color: #166534 !important; }

.theorem.kind-proposition { border-left-color: #6b21a8 !important; }
.theorem.kind-proposition > .theorem-header { color: #6b21a8 !important; }

.theorem.kind-theorem { border-left-color: #991b1b !important; }
.theorem.kind-theorem > .theorem-header { color: #991b1b !important; }

.theorem.kind-remark { border-left-color: #b45309 !important; }
.theorem.kind-remark > .theorem-header { color: #b45309 !important; cursor: default !important; }

.theorem.kind-example { border-left-color: #334155 !important; }
.theorem.kind-example > .theorem-header { color: #334155 !important; }

/* --------------------------------------------------------------------------
   4. 证明环境 (.proof)：深烟灰、8px 圆角、默认折叠
   -------------------------------------------------------------------------- */
.proof {
  margin: 0.9rem 0 1.35rem !important;
  padding: 0 !important;
  background: transparent !important;
  background-color: transparent !important;
  border-radius: 8px !important;
  border: 1px solid rgba(0, 0, 0, 0.08) !important;
  border-left: 4px solid #64748b !important;
  overflow: hidden !important;
}

.proof-header {
  cursor: pointer !important;
  user-select: none;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 0.4rem 0.9rem !important;
  font-weight: 600 !important;
  color: #475569 !important;
  font-size: 0.96rem !important;
}
.proof-header:hover { opacity: 0.85; }

.proof-body {
  padding: 0.35rem 0.9rem 0.65rem !important;
}
.proof.is-folded .proof-body {
  display: none !important;
}

/* --------------------------------------------------------------------------
   5. 右侧边栏条目与滚动高亮
   -------------------------------------------------------------------------- */
.callout-toc-item a.nav-link {
  padding-left: 1.8rem !important;
  font-size: 0.85rem !important;
  opacity: 0.82;
  cursor: pointer !important;
  transition: all 0.15s ease;
}
.callout-toc-item a.nav-link:hover {
  opacity: 1;
  color: #1e40af !important;
}

nav#TOC a.nav-link.active-math-target,
nav#TOC li.active > a.nav-link {
  color: #1e40af !important;
  font-weight: 700 !important;
  opacity: 1 !important;
  border-left: 2.5px solid #1e40af !important;
}
</style>

<script>
(function() {
  const ENV_CONFIG = {
    definition:  { full: 'Definition',  short: 'Def' },
    lemma:       { full: 'Lemma',       short: 'Lem' },
    proposition: { full: 'Proposition', short: 'Prop' },
    theorem:     { full: 'Theorem',     short: 'Thm' },
    corollary:   { full: 'Corollary',   short: 'Cor' },
    remark:      { full: 'Remark',      short: 'Rem' },
    example:     { full: 'Example',     short: 'Ex' }
  };

  const CHEVRON_SVG = `<svg class="fold-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

  function getSecPrefix() {
    const sec = getComputedStyle(document.documentElement).getPropertyValue('--sec').trim();
    return sec ? sec.replace(/["']/g, '') : "23.0.";
  }

  function ensureTocList() {
    let list = document.querySelector('#TOC > ul') ||
               document.querySelector('nav[role="doc-toc"] > ul') ||
               document.querySelector('#quarto-toc-target > ul');
    if (list) return list;

    let marginSidebar = document.querySelector('#quarto-margin-sidebar, .margin-sidebar');
    if (!marginSidebar) {
      const content = document.querySelector('#quarto-content') || document.querySelector('.page-columns');
      if (content) {
        marginSidebar = document.createElement('div');
        marginSidebar.id = 'quarto-margin-sidebar';
        marginSidebar.className = 'sidebar margin-sidebar';
        content.appendChild(marginSidebar);
      }
    }

    if (marginSidebar) {
      marginSidebar.style.display = 'block';
      let nav = marginSidebar.querySelector('#TOC');
      if (!nav) {
        nav = document.createElement('nav');
        nav.id = 'TOC';
        nav.setAttribute('role', 'doc-toc');
        nav.className = 'toc-active';
        nav.innerHTML = '<h2 id="toc-title">On this page</h2><ul></ul>';
        marginSidebar.appendChild(nav);
      }
      return nav.querySelector('ul');
    }
    return null;
  }

  // 多维精准类型识别
  function detectKind(node, titleText) {
    const id = (node.id || "").toLowerCase();
    const cls = (node.className || "").toLowerCase();
    const title = (titleText || "").toLowerCase();

    if (id.startsWith('rem-') || cls.includes('remark') || /^remark\b/.test(title)) return 'remark';
    if (id.startsWith('exm-') || cls.includes('example') || /^example\b/.test(title)) return 'example';
    if (id.startsWith('def-') || cls.includes('definition') || /^definition\b/.test(title)) return 'definition';
    if (id.startsWith('lem-') || cls.includes('lemma') || /^lemma\b/.test(title)) return 'lemma';
    if (id.startsWith('prp-') || cls.includes('proposition') || /^proposition\b/.test(title)) return 'proposition';
    if (id.startsWith('cor-') || cls.includes('corollary') || /^corollary\b/.test(title)) return 'corollary';
    if (id.startsWith('thm-') || cls.includes('theorem') || /^theorem\b/.test(title)) return 'theorem';
    return 'theorem';
  }

  // 1. 处理定理、例题与注记
  function processTheorems() {
    const secPrefix = getSecPrefix();
    let counter = 0;

    const tocList = ensureTocList();
    if (tocList) {
      tocList.querySelectorAll('li[data-callout-toc]').forEach(el => el.remove());
    }

    // 扫描范围：扩大包含 .theorem、.remark 以及以对应前缀开头的区块
    const pageNodes = document.querySelectorAll(
      'main h2, main h3, #quarto-document-content h2, #quarto-document-content h3, .theorem, .remark, [id^="def-"], [id^="lem-"], [id^="prp-"], [id^="thm-"], [id^="cor-"], [id^="rem-"], [id^="exm-"]'
    );

    let lastTocAnchor = null;

    pageNodes.forEach(node => {
      if (node.tagName === 'H2' || node.tagName === 'H3') {
        if (tocList && node.id) {
          const a = tocList.querySelector(`a[href="#${CSS.escape(node.id)}"]`);
          if (a) lastTocAnchor = a.closest('li');
        }
        return;
      }

      // 如果不是章节标题，那就是数学环境
      if (node.dataset.mathProcessed === "true") return;
      node.dataset.mathProcessed = "true";

      const titleSpan = node.querySelector('.theorem-title');
      let rawTitle = titleSpan ? titleSpan.textContent.trim() : "";
      let subTitle = "";

      const match = rawTitle.match(/\((.*?)\)/);
      if (match) subTitle = ` (${match[1]})`;
      if (titleSpan) titleSpan.remove();

      const firstP = node.querySelector(':scope > p:first-child');
      if (firstP && firstP.textContent.trim() === '') firstP.remove();

      const kind = detectKind(node, rawTitle);
      const conf = ENV_CONFIG[kind] || { full: 'Theorem', short: 'Thm' };
      const numStr = secPrefix + counter;
      counter++;

      // 确保 Remark 绝对不折叠
      const canFold = (kind !== 'remark');
      node.classList.add('theorem', `kind-${kind}`);

      const header = document.createElement('div');
      header.className = `theorem-header ${canFold ? 'is-clickable' : ''}`;
      header.innerHTML = `<span><strong>${conf.full} ${numStr}</strong>${subTitle}</span>${canFold ? CHEVRON_SVG : ''}`;

      const body = document.createElement('div');
      body.className = 'theorem-body';
      while (node.firstChild) {
        body.appendChild(node.firstChild);
      }

      node.appendChild(header);
      node.appendChild(body);

      if (canFold) {
        header.addEventListener('click', () => {
          node.classList.toggle('is-folded');
        });
      }

      if (!node.id) {
        node.id = `thm-${conf.short.toLowerCase()}-${numStr.replace(/\./g, '-')}`;
      }

      // 插入右侧大纲，并绑定丝滑平滑滚动
      if (tocList) {
        const li = document.createElement('li');
        li.setAttribute('data-callout-toc', 'true');
        li.className = 'nav-item callout-toc-item';

        const a = document.createElement('a');
        a.className = 'nav-link';
        a.href = `#${node.id}`;
        a.setAttribute('data-scroll-target', `#${node.id}`);
        a.textContent = `${conf.short} ${numStr}`;

        // 核心修复：原生平滑滚动跳转事件，完美规避导航栏遮挡
        a.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();

          const target = document.getElementById(node.id);
          if (target) {
            const navbar = document.querySelector('.navbar, header.fixed-top');
            const navH = navbar ? navbar.getBoundingClientRect().height : 55;
            const targetY = target.getBoundingClientRect().top + window.pageYOffset - navH - 18;

            window.scrollTo({
              top: targetY,
              behavior: 'smooth'
            });

            if (history.pushState) {
              history.pushState(null, null, '#' + node.id);
            }
          }
        });

        li.appendChild(a);

        if (lastTocAnchor && lastTocAnchor.parentNode) {
          lastTocAnchor.parentNode.insertBefore(li, lastTocAnchor.nextSibling);
          lastTocAnchor = li;
        } else {
          tocList.appendChild(li);
          lastTocAnchor = li;
        }
      }
    });
  }

  // 2. 处理证明环境：硬性排除 Remark，仅针对真正的 Proof
  function processProofs() {
    // 关键修复：排除 .remark 和 id 为 rem- 开头的区块，防止误伤
    const proofs = document.querySelectorAll('.proof:not(.remark):not([id^="rem-"])');
    proofs.forEach(proof => {
      if (proof.dataset.mathProcessed === "true") return;
      proof.dataset.mathProcessed = "true";

      let proofLabel = "Proof.";
      const firstP = proof.querySelector('p');
      if (firstP) {
        const titleSpan = firstP.querySelector('.proof-title');
        if (titleSpan) {
          proofLabel = titleSpan.textContent.trim();
          titleSpan.remove();
        } else {
          const em = firstP.querySelector('em');
          if (em && /proof/i.test(em.textContent)) {
            proofLabel = em.textContent.trim();
            em.remove();
          }
        }
      }

      const header = document.createElement('div');
      header.className = 'proof-header';
      header.innerHTML = `<span><em>${proofLabel}</em></span>${CHEVRON_SVG}`;

      const body = document.createElement('div');
      body.className = 'proof-body';
      while (proof.firstChild) {
        body.appendChild(proof.firstChild);
      }

      proof.appendChild(header);
      proof.appendChild(body);

      // 真正证明环境才默认折叠
      proof.classList.add('is-folded');

      header.addEventListener('click', () => {
        proof.classList.toggle('is-folded');
      });
    });
  }

  // 3. 滚动监听：实时高亮右侧当前位置
  function initScrollSpy() {
    const tocLinks = document.querySelectorAll('#TOC a.nav-link');
    if (!tocLinks.length) return;

    function onScroll() {
      const scrollY = window.scrollY + 140;
      const targets = Array.from(document.querySelectorAll('main h2[id], main h3[id], .theorem[id]'));

      let current = null;
      for (const el of targets) {
        if (el.offsetTop <= scrollY) {
          current = el;
        } else {
          break;
        }
      }

      if (current) {
        tocLinks.forEach(a => a.classList.remove('active-math-target'));
        const activeA = document.querySelector(`#TOC a[href="#${CSS.escape(current.id)}"]`);
        if (activeA) {
          activeA.classList.add('active-math-target');
        }
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
  }

  let hasInit = false;
  function run() {
    if (hasInit) return;
    const items = document.querySelectorAll('.theorem, [id^="def-"], [id^="lem-"], [id^="rem-"]');
    if (!items.length && document.readyState === 'loading') return;
    hasInit = true;
    processTheorems();
    processProofs();
    initScrollSpy();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
  window.addEventListener('load', run);
})();
</script>

/* --------------------------------------------------------------------------

  display: none;

/* 无目录条目时用 hidden 关掉，避免只剩一个空壳标题 */

@media (max-width: 991.98px) {
  .note-mobile-toc {
    display: block;

/* Quarto 自带的浮层副本（仅在右侧栏与 margin 内容重叠时出现）同样保证可滚动 */
#quarto-toc-toggle .quarto-sidebar-toggle-contents {
  max-height: 70vh !important;
  overflow-y: auto !important;
  overscroll-behavior: contain;
}

/* 直接用 #锚点 打开页面（分享链接、前进/后退）时，同样避开吸顶导航栏 */
.theorem,

<script>
(function () {
  "use strict";

  /* 目录条目、定理编号、折叠外壳都由 _filters/theorem-toc.lua 在构建时写好，
     这里只负责交互：点击跳转、选中态、折叠开关、窄屏摆放。 */

  const TOC_SCOPE = 'nav[role="doc-toc"]';
  const TOC_LINK = 'a.nav-link';
  const SCROLL_TARGETS = 'section[id], h2[id], h3[id], .theorem[id]';
  const SCROLL_THRESHOLD = 140;   /* 判定“当前小节”的顶部偏移 */
  const NAV_FALLBACK_HEIGHT = 55; /* 吸顶导航栏高度兜底值 */
  const SCROLL_GAP = 18;          /* 锚点与导航栏之间的呼吸间距 */
  const MOBILE_MEDIA = '(max-width: 991.98px)';

  let tocTargets = [];
  let spyBound = false;
  let mobileHost = null;
  let mobileMedia = null;
  let tocHome = null;         /* nav#TOC 在桌面端的父容器（右侧栏） */
  let tocNextSibling = null;  /* 以及它原来的下一个兄弟节点，便于原位放回 */

  /* ------------------------------------------------------------ 目录跳转 */

  /* 链接 href 形如 "#thm-fujita-vanishing"，取出解码后的锚点 id */
  function tocHrefId(link) {
    const raw = link.getAttribute('href') || '';
    const pos = raw.indexOf('#');
    if (pos === -1) return '';
    const hash = raw.slice(pos + 1);
    try {
      return decodeURIComponent(hash);
    } catch (err) {
      return hash;
    }
  }

  /* 滚动留白：吸顶导航栏高度 + 固定呼吸间距（桌面 / 移动一致） */
  function tocScrollOffset() {
    const navbar = document.querySelector('.navbar, header.fixed-top');
    const navHeight = navbar ? navbar.getBoundingClientRect().height : NAV_FALLBACK_HEIGHT;
    return navHeight + SCROLL_GAP;
  }

  function scrollToAnchor(target) {
    // 目标若在折叠中的定理/证明里（或本身被折叠），逐层展开，否则跳过去看不到内容
    let folded = target.closest('.is-folded');
    while (folded) {
      folded.classList.remove('is-folded');
      folded = folded.parentElement ? folded.parentElement.closest('.is-folded') : null;
    }

    const top = target.getBoundingClientRect().top + window.scrollY - tocScrollOffset();
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: top, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  /* 全站唯一选中态：桌面 nav 与窄屏副本里的同一锚点一起高亮 */
  function setTocActive(id) {
    document.querySelectorAll(TOC_SCOPE + ' ' + TOC_LINK).forEach(function (a) {
      const on = id !== '' && tocHrefId(a) === id;
      a.classList.toggle('active', on);
      a.classList.toggle('active-math-target', on);
    });
  }

  function tocNav() {
    return document.querySelector('#quarto-margin-sidebar ' + TOC_SCOPE) || document.querySelector(TOC_SCOPE);
  }

  /* -------------------------------------------- 窄屏：目录挪进正文流折叠块 */

  function ensureInlineToc() {
    if (mobileHost && document.contains(mobileHost)) return mobileHost;

    const content = document.querySelector('#quarto-document-content') || document.querySelector('main');
    if (!content) return null;

    mobileHost = document.createElement('details');
    mobileHost.id = 'note-mobile-toc';
    mobileHost.className = 'note-mobile-toc';
    mobileHost.innerHTML = '<summary>On this page</summary><div class="note-mobile-toc-body"></div>';

    // 放在标题块之后，正文之前
    const titleBlock = content.querySelector('#title-block-header');
    if (titleBlock && titleBlock.nextSibling) {
      content.insertBefore(mobileHost, titleBlock.nextSibling);
    } else {
      content.insertBefore(mobileHost, content.firstChild);
    }
    return mobileHost;
  }

  function syncMobileToc() {
    const nav = tocNav();
    if (!nav) return;   // 页面没有右侧目录时不必建折叠块

    const host = ensureInlineToc();
    if (!host) return;

    if (!tocHome && nav.parentElement !== host) {
      tocHome = nav.parentElement;
      tocNextSibling = nav.nextSibling;
    }

    const onMobile = mobileMedia ? mobileMedia.matches : window.innerWidth <= 991;
    const useInline = onMobile && !!nav.querySelector(TOC_LINK);   // 有目录才值得放进正文
    host.hidden = !useInline;

    if (useInline) {
      const body = host.querySelector('.note-mobile-toc-body');
      if (nav.parentElement !== body) body.appendChild(nav);
    } else if (tocHome && nav.parentElement !== tocHome) {
      const anchor = tocNextSibling && tocNextSibling.parentNode === tocHome ? tocNextSibling : null;
      tocHome.insertBefore(nav, anchor);   // 原位放回右侧栏
    }
  }

  /* 跳转后收起浮层/折叠块，否则会挡住刚滚到的内容 */
  function closeMobileToc() {
    if (mobileHost) mobileHost.open = false;

    const toggle = document.getElementById('quarto-toc-toggle');
    if (!toggle || !toggle.classList.contains('expanded')) return;
    const title = toggle.querySelector('.quarto-sidebar-toggle-title');
    if (title) title.click();   // 交回 Quarto 自身的开关逻辑，保持其内部状态一致
  }

  /* ---------------------------------------------------------- 点击代理 */

  function onDocumentClick(event) {
    if (event.defaultPrevented || event.button !== 0) return;

    const target = event.target;

    // 1) 目录项：统一接管滚动、地址栏哈希与高亮
    const link = target.closest ? target.closest('a') : null;
    if (link && link.closest(TOC_SCOPE)) {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;  // 保留新标签页等默认行为
      const id = tocHrefId(link);
      const anchor = id ? document.getElementById(id) : null;
      if (anchor) {
        // 拦在 Quarto 自带的点击处理之前，避免重复滚动
        event.preventDefault();
        event.stopPropagation();
        scrollToAnchor(anchor);
        setTocActive(id);
        closeMobileToc();
        history.pushState(null, null, '#' + id);
      }
      return;
    }

    // 2) 折叠头：展开/收起定理或证明
    const header = target.closest ? target.closest('.theorem-header.is-clickable, .proof-header') : null;
    if (header && header.parentElement) {
      header.parentElement.classList.toggle('is-folded');
    }
  }

  /* -------------------------------------------------------- 侧边栏排序 */

  function textOf(el) {
    const label = el.querySelector('.sidebar-item-text, .menu-text, a');
    return (label && label.textContent.trim()) || el.textContent.trim();
  }

  function sortSidebarNumerically() {
    document.querySelectorAll('#quarto-sidebar ul').forEach(function (ul) {
      const items = Array.from(ul.children).filter(function (el) {
        return el.classList.contains('sidebar-item');
      });
      if (items.length <= 1) return;

      // numeric:true 让 "10" 排在 "2" 之后
      items.sort(function (a, b) {
        return textOf(a).localeCompare(textOf(b), undefined, { numeric: true, sensitivity: 'base' });
      });

      items.forEach(function (item) { ul.appendChild(item); });
    });
  }

  /* 仍被省略号收尾的条目，补上悬停提示，方便看到完整章节名 */
  function tagSidebarTitles() {
    document.querySelectorAll('#quarto-sidebar .sidebar-link').forEach(function (link) {
      const label = link.querySelector('.menu-text') || link;
      const text = label.textContent.trim();
      if (text && !link.title) link.title = text;
    });
  }

  /* -------------------------------------------------------- 目录滚动高亮 */

  function collectTargets() {
    return Array.from(document.querySelectorAll(SCROLL_TARGETS)).filter(function (el) {
      return !el.closest(TOC_SCOPE);   // 排除目录自身的标题
    });
  }

  /* 选出「当前所在项」：最后一个顶部已越过阈值的小节/定理锚点 */
  function updateActiveTocLink() {
    if (!tocTargets.length) return;

    let current = null;
    for (const el of tocTargets) {
      if (el.getBoundingClientRect().top <= SCROLL_THRESHOLD) {
        current = el;
      } else {
        break;
      }
    }
    if (!current && window.scrollY < 120) current = tocTargets[0];
    if (!current || !current.id) return;

    setTocActive(current.id);
  }

  function init() {
    sortSidebarNumerically();
    tagSidebarTitles();
    syncMobileToc();

    // 监听只绑定一次；重复调用只刷新锚点缓存与高亮
    if (!spyBound) {
      spyBound = true;

      let ticking = false;
      window.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () {
          ticking = false;
          updateActiveTocLink();
        });
      }, { passive: true });

      document.addEventListener('click', onDocumentClick, true);

      // Quarto 自带的 scrollspy 也会加 .active；等它更新后（rAF 晚一拍）再确认唯一高亮
      window.addEventListener('quarto-sectionChanged', function () {
        requestAnimationFrame(updateActiveTocLink);
      });

      // 跨过 992px 断点时，在「右侧栏」与「正文内折叠块」之间搬运目录
      if (window.matchMedia) {
        mobileMedia = window.matchMedia(MOBILE_MEDIA);
        const handleBreakpoint = function () { syncMobileToc(); tagSidebarTitles(); };
        if (mobileMedia.addEventListener) mobileMedia.addEventListener('change', handleBreakpoint);
        else if (mobileMedia.addListener) mobileMedia.addListener(handleBreakpoint);
      }
    }

    tocTargets = collectTargets();
    setTimeout(updateActiveTocLink, 150);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  window.addEventListener('load', init, { once: true });

  // 深浅色切换后重新对齐
  window.addEventListener('quarto-color-scheme-change', function () {
    setTimeout(init, 150);
  });
})();
</script>

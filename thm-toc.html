<!-- thm-toc.html -->
<script>
(function() {
  function injectThmToToc() {
    const callouts = document.querySelectorAll(".callout");
    if (callouts.length === 0) return;

    callouts.forEach(box => {
      const titleEl = box.querySelector(".callout-title-container, .callout-header");
      if (!titleEl) return;

      const text = titleEl.textContent;
      const m = text.match(/(Proposition|Theorem)\s+([\d\.]+)/i);
      
      if (m) {
        const type = m[1].toLowerCase().startsWith("p") ? "Prop" : "Thm";
        const num = m[2];
        const anchorId = "thm-" + num.replace(/\./g, "-");

        box.id = anchorId;

        // 获取所有匹配的 TOC 列表并插入
        document.querySelectorAll("#TOC ul, nav[role='doc-toc'] ul").forEach(ul => {
          if (ul.querySelector(`a[href="#${anchorId}"]`)) return;

          const li = document.createElement("li");
          li.style.display = "block";

          const a = document.createElement("a");
          a.className = "nav-link";
          a.href = `#${anchorId}`;
          a.setAttribute("data-scroll-target", `#${anchorId}`);
          a.textContent = `${type} ${num}`;
          a.style.display = "block";
          a.style.paddingLeft = "1.5rem";
          a.style.opacity = "1";

          li.appendChild(a);
          ul.appendChild(li);
        });
      }
    });
  }

  // 延时加载以避开 Bootstrap Scrollspy 的初始化覆盖
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", () => setTimeout(injectThmToToc, 300));
  } else {
    setTimeout(injectThmToToc, 300);
  }
})();
</script>

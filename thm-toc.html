<style>
/* --------------------------------------------------------------------------
   1. 缩小文章副标题 (Subtitle) 与暗色适配
   -------------------------------------------------------------------------- */
.quarto-title .subtitle,
header#title-block-header .subtitle,
p.subtitle.lead {
  font-size: 1.08rem !important;
  font-weight: 400 !important;
  line-height: 1.5 !important;

  margin-bottom: 1rem !important;

body.quarto-dark .quarto-title .subtitle,
body.quarto-dark header#title-block-header .subtitle,
body.quarto-dark p.subtitle.lead {

}

/* 标题字号微调 */

.callout-header,

  font-weight: 700 !important;
  letter-spacing: 0.01em !important;
}

/* --------------------------------------------------------------------------

  #quarto-sidebar,

    padding-left: 0.35rem !important;

  }

  #quarto-sidebar .sidebar-item-container {
    padding-left: 0 !important;

  }

  #quarto-sidebar .sidebar-section .sidebar-item {
    padding-left: 0.6rem !important;
  }

  #quarto-sidebar .sidebar-link {
    padding-left: 0.2rem !important;

    white-space: nowrap !important;
  }

  #quarto-sidebar .menu-text {
    white-space: nowrap !important;
  }
}

/* --------------------------------------------------------------------------
   3. 紧凑型页脚
   -------------------------------------------------------------------------- */
footer.footer,
.nav-footer {

/* --------------------------------------------------------------------------
   4. 右侧目录标题 "ON THIS PAGE"

/* --------------------------------------------------------------------------
   5. 定理环境基础外观与折叠动画
   -------------------------------------------------------------------------- */
.theorem {
  margin: 1.25rem 0 !important;
  padding: 0 !important;
  background-color: transparent !important;
  border-radius: 8px !important;
  border: 1px solid rgba(0, 0, 0, 0.09) !important;

  overflow: hidden !important;
  scroll-margin-top: 4.8rem !important; /* 关键：锚点跳转时避开顶部导航栏 */
  transition: border-color 0.2s ease, background-color 0.2s ease;
}

body.quarto-dark .theorem,
body.quarto-dark .proof {
  border-color: rgba(255, 255, 255, 0.12) !important;
  background-color: rgba(255, 255, 255, 0.02) !important;
}

@media (prefers-color-scheme: dark) {
  body:not(.quarto-light) .theorem,
  body:not(.quarto-light) .proof {
    border-color: rgba(255, 255, 255, 0.12) !important;
    background-color: rgba(255, 255, 255, 0.02) !important;
  }
}

.theorem-header {
  user-select: none;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 0.55rem 0.95rem !important;
  font-weight: 700 !important;
  font-size: 1.05rem !important;

  background: transparent !important;
}

.theorem-header.is-clickable {
  cursor: pointer !important;
}

.theorem-header.is-clickable:hover {
  opacity: 0.85;
}

.theorem-body {
  padding: 0.35rem 0.95rem 0.75rem !important;
  background: transparent !important;
}

.theorem.is-folded .theorem-body {
  display: none !important;
}

.fold-chevron {
  display: inline-flex;
  align-items: center;
  margin-left: 0.75rem;
  opacity: 0.7;
  transition: transform 0.22s ease;
  flex-shrink: 0;
}

.theorem-header:hover .fold-chevron,
.proof-header:hover .fold-chevron {
  opacity: 1;
}

.theorem.is-folded .fold-chevron,
.proof.is-folded .fold-chevron {
  transform: rotate(-90deg);
}

/* --------------------------------------------------------------------------
   6. 专业学术色彩系统：同时兼容日间深沉与夜间明亮高对比度
   -------------------------------------------------------------------------- */
/* 定义 (Definition) - 蔚蓝 */
.theorem.kind-definition { border-left-color: #1e40af !important; }
.theorem.kind-definition > .theorem-header { color: #1e40af !important; }
body.quarto-dark .theorem.kind-definition { border-left-color: #3b82f6 !important; }
body.quarto-dark .theorem.kind-definition > .theorem-header { color: #60a5fa !important; }

/* 引理 (Lemma) - 翠绿 */
.theorem.kind-lemma { border-left-color: #166534 !important; }
.theorem.kind-lemma > .theorem-header { color: #166534 !important; }
body.quarto-dark .theorem.kind-lemma { border-left-color: #22c55e !important; }
body.quarto-dark .theorem.kind-lemma > .theorem-header { color: #4ade80 !important; }

/* 命题 (Proposition) - 紫罗兰 */
.theorem.kind-proposition { border-left-color: #6b21a8 !important; }
.theorem.kind-proposition > .theorem-header { color: #6b21a8 !important; }
body.quarto-dark .theorem.kind-proposition { border-left-color: #a855f7 !important; }
body.quarto-dark .theorem.kind-proposition > .theorem-header { color: #c084fc !important; }

/* 定理 (Theorem) - 绯红 */
.theorem.kind-theorem { border-left-color: #991b1b !important; }
.theorem.kind-theorem > .theorem-header { color: #991b1b !important; }
body.quarto-dark .theorem.kind-theorem { border-left-color: #ef4444 !important; }
body.quarto-dark .theorem.kind-theorem > .theorem-header { color: #f87171 !important; }

/* 推论 (Corollary) - 暖橙 */
.theorem.kind-corollary { border-left-color: #c2410c !important; }
.theorem.kind-corollary > .theorem-header { color: #c2410c !important; }
body.quarto-dark .theorem.kind-corollary { border-left-color: #f97316 !important; }
body.quarto-dark .theorem.kind-corollary > .theorem-header { color: #fb923c !important; }

/* 注记 (Remark) - 琥珀金 */
.theorem.kind-remark { border-left-color: #b45309 !important; }
.theorem.kind-remark > .theorem-header { color: #b45309 !important; cursor: default !important; }
body.quarto-dark .theorem.kind-remark { border-left-color: #f59e0b !important; }
body.quarto-dark .theorem.kind-remark > .theorem-header { color: #fbbf24 !important; }

/* 例题 (Example) - 冷灰蓝 */
.theorem.kind-example { border-left-color: #334155 !important; }
.theorem.kind-example > .theorem-header { color: #334155 !important; }
body.quarto-dark .theorem.kind-example { border-left-color: #64748b !important; }
body.quarto-dark .theorem.kind-example > .theorem-header { color: #cbd5e1 !important; }

/* --------------------------------------------------------------------------
   7. 证明环境 (.proof)
   -------------------------------------------------------------------------- */
.proof {
  margin: 0.9rem 0 1.35rem !important;
  padding: 0 !important;
  background: transparent !important;
  border-radius: 8px !important;
  border: 1px solid rgba(0, 0, 0, 0.08) !important;
  border-left: 4px solid #64748b !important;
  overflow: hidden !important;
  scroll-margin-top: 4.8rem !important;
}

body.quarto-dark .proof {
  border-left-color: #94a3b8 !important;
}

.proof-header {
  cursor: pointer !important;
  user-select: none;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 0.4rem 0.9rem !important;
  font-weight: 600 !important;
  color: #475569 !important;
  font-size: 0.96rem !important;
}

body.quarto-dark .proof-header {
  color: #94a3b8 !important;
}

.proof-body {
  padding: 0.35rem 0.9rem 0.65rem !important;
}

.proof.is-folded .proof-body {
  display: none !important;
}

/* --------------------------------------------------------------------------
   8. 右侧边栏条目重构（一体贯通导轨 + 彻底消灭青蓝双竖线冲突）
   -------------------------------------------------------------------------- */
/* 统一定制 TOC 目录的贯通导轨竖线 */
nav#TOC > ul {
  list-style: none !important;
  padding-left: 0 !important;
  margin-left: 0 !important;
  border-left: 1.5px solid #d0dfec !important;
}

body.quarto-dark nav#TOC > ul {
  border-left-color: #334454 !important;
}

nav#TOC li {
  margin-bottom: 0.15rem !important;
  list-style: none !important;
}

/* 紧凑对齐，取消导致断层的大缩进 (原 1.8rem) */
nav#TOC a.nav-link,
.callout-toc-item a.nav-link {
  display: block !important;
  padding: 0.22rem 0.5rem 0.22rem 0.75rem !important;
  margin-left: -1.5px !important; /* 紧密吻合左侧导轨 */
  border-left: 2.5px solid transparent !important;
  font-size: 0.86rem !important;
  color: #4a5568 !important;
  text-decoration: none !important;
  border-radius: 0 4px 4px 0 !important;
  transition: all 0.15s ease !important;
  cursor: pointer !important;
}

body.quarto-dark nav#TOC a.nav-link,
body.quarto-dark .callout-toc-item a.nav-link {
  color: #94a3b8 !important;
}

nav#TOC a.nav-link:hover,
.callout-toc-item a.nav-link:hover {
  color: #2b6cb0 !important;
  background-color: rgba(43, 108, 176, 0.06) !important;
}

body.quarto-dark nav#TOC a.nav-link:hover,
body.quarto-dark .callout-toc-item a.nav-link:hover {
  color: #60a5fa !important;
  background-color: rgba(96, 165, 250, 0.08) !important;
}

/* 核心修复：彻底覆盖 Quarto 默认 Cosmo 青色，统一高亮规范 */
div.quarto-toc nav[role=doc-toc]>ul>li>a.active,
div.quarto-toc nav[role=doc-toc]>ul>li>ul>li>a.active,
nav#TOC a.nav-link.active,
nav#TOC a.nav-link.active-math-target,
nav#TOC li.active > a.nav-link {
  color: #2b6cb0 !important;
  border-left: 2.5px solid #2b6cb0 !important;
  font-weight: 700 !important;
  background-color: rgba(43, 108, 176, 0.08) !important;
  opacity: 1 !important;
}

body.quarto-dark div.quarto-toc nav[role=doc-toc]>ul>li>a.active,
body.quarto-dark div.quarto-toc nav[role=doc-toc]>ul>li>ul>li>a.active,
body.quarto-dark nav#TOC a.nav-link.active,
body.quarto-dark nav#TOC a.nav-link.active-math-target,
body.quarto-dark nav#TOC li.active > a.nav-link {
  color: #60a5fa !important;
  border-left-color: #60a5fa !important;
  background-color: rgba(96, 165, 250, 0.12) !important;
}
</style>

<script>
(function() {
  const ENV_CONFIG = {
    definition:  { full: 'Definition',  short: 'Def' },
    lemma:       { full: 'Lemma',       short: 'Lem' },
    proposition: { full: 'Proposition', short: 'Prop' },
    theorem:     { full: 'Theorem',     short: 'Thm' },
    corollary:   { full: 'Corollary',   short: 'Cor' },
    remark:      { full: 'Remark',      short: 'Rem' },
    example:     { full: 'Example',     short: 'Ex' }
  };

  const CHEVRON_SVG = `<svg class="fold-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

  // 1. 自动提取页面章节前缀（如 22.8.）
  function getSecPrefix() {
    const sec = getComputedStyle(document.documentElement).getPropertyValue('--sec').trim();
    if (sec) {
      const clean = sec.replace(/["']/g, '');
      return clean.endsWith('.') ? clean : clean + '.';
    }

    const titleEl = document.querySelector('h1.title, .quarto-title h1, header#title-block-header h1, #title-block-header .title');
    const titleText = titleEl ? titleEl.textContent.trim() : document.title.trim();
    const match = titleText.match(/^(\d+(?:\.\d+)*)\.?\s*/);
    if (match) {
      return match[1] + '.';
    }
    return "22.0.";
  }

  // 2. 确保右侧大纲容器准备完毕
  function ensureTocList() {
    let list = document.querySelector('#TOC > ul') ||
               document.querySelector('nav[role="doc-toc"] > ul') ||
               document.querySelector('#quarto-toc-target > ul');
    if (list) return list;

    let marginSidebar = document.querySelector('#quarto-margin-sidebar, .margin-sidebar');
    if (!marginSidebar) {
      const content = document.querySelector('#quarto-content') || document.querySelector('.page-columns');
      if (content) {
        marginSidebar = document.createElement('div');
        marginSidebar.id = 'quarto-margin-sidebar';
        marginSidebar.className = 'sidebar margin-sidebar';
        content.appendChild(marginSidebar);
      }
    }

    if (marginSidebar) {
      marginSidebar.style.display = 'block';
      let nav = marginSidebar.querySelector('#TOC');
      if (!nav) {
        nav = document.createElement('nav');
        nav.id = 'TOC';
        nav.setAttribute('role', 'doc-toc');
        nav.className = 'toc-active';
        nav.innerHTML = '<h2 id="toc-title">On this page</h2><ul></ul>';
        marginSidebar.appendChild(nav);
      }
      return nav.querySelector('ul');
    }
    return null;
  }

  // 3. 多维精准定理类型识别
  function detectKind(node, titleText) {
    const id = (node.id || "").toLowerCase();
    const cls = (node.className || "").toLowerCase();
    const title = (titleText || "").toLowerCase();

    if (id.startsWith('rem-') || cls.includes('remark') || /^remark\b/.test(title)) return 'remark';
    if (id.startsWith('exm-') || cls.includes('example') || /^example\b/.test(title)) return 'example';
    if (id.startsWith('def-') || cls.includes('definition') || /^definition\b/.test(title)) return 'definition';
    if (id.startsWith('lem-') || cls.includes('lemma') || /^lemma\b/.test(title)) return 'lemma';
    if (id.startsWith('prp-') || cls.includes('proposition') || /^proposition\b/.test(title)) return 'proposition';
    if (id.startsWith('cor-') || cls.includes('corollary') || /^corollary\b/.test(title)) return 'corollary';
    if (id.startsWith('thm-') || cls.includes('theorem') || /^theorem\b/.test(title)) return 'theorem';
    return 'theorem';
  }

  function triggerMathTypeset(elements) {
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise(elements).catch(function(err) {
        console.error("MathJax typeset failed: ", err);
      });
    } else if (window.MathJax && window.MathJax.Hub) {
      window.MathJax.Hub.Queue(["Typeset", window.MathJax.Hub, elements]);
    }
  }

  // 4. 处理定理、例题与右侧大纲挂载
  function processTheorems() {
    const secPrefix = getSecPrefix();
    let counter = 0;

    const tocList = ensureTocList();
    if (tocList) {
      tocList.querySelectorAll('li[data-callout-toc]').forEach(el => el.remove());
    }

    const pageNodes = document.querySelectorAll(
      'main h2, main h3, #quarto-document-content h2, #quarto-document-content h3, .theorem, .remark, [id^="def-"], [id^="lem-"], [id^="prp-"], [id^="thm-"], [id^="cor-"], [id^="rem-"], [id^="exm-"]'
    );

    let lastTocAnchor = null;
    const headersToTypeset = [];

    pageNodes.forEach(node => {
      // 记录最近的 H2 / H3 标题位置，保证定理按章节就近插入
      if (node.tagName === 'H2' || node.tagName === 'H3') {
        if (tocList && node.id) {
          const a = tocList.querySelector(`a[href="#${CSS.escape(node.id)}"]`);
          if (a) lastTocAnchor = a.closest('li');
        }
        return;
      }

      if (node.dataset.mathProcessed === "true") return;
      node.dataset.mathProcessed = "true";

      const titleSpan = node.querySelector('.theorem-title');
      let rawTitleHtml = titleSpan ? titleSpan.innerHTML.trim() : "";
      let subTitle = "";

      const match = rawTitleHtml.match(/\(([\s\S]*)\)/);
      if (match) {
        subTitle = ` (${match[1].trim()})`;
      }
      if (titleSpan) titleSpan.remove();

      const firstP = node.querySelector(':scope > p:first-child');
      if (firstP && firstP.textContent.trim() === '') firstP.remove();

      const kind = detectKind(node, rawTitleHtml);
      const conf = ENV_CONFIG[kind] || { full: 'Theorem', short: 'Thm' };
      const numStr = secPrefix + counter;
      counter++;

      const canFold = (kind !== 'remark');
      node.classList.add('theorem', `kind-${kind}`);

      const header = document.createElement('div');
      header.className = `theorem-header ${canFold ? 'is-clickable' : ''}`;
      header.innerHTML = `<span><strong>${conf.full} ${numStr}</strong>${subTitle}</span>${canFold ? CHEVRON_SVG : ''}`;

      const body = document.createElement('div');
      body.className = 'theorem-body';
      while (node.firstChild) {
        body.appendChild(node.firstChild);
      }

      node.appendChild(header);
      node.appendChild(body);
      headersToTypeset.push(header);

      if (canFold) {
        header.addEventListener('click', () => {
          node.classList.toggle('is-folded');
        });
      }

      // 生成安全的 ID（用短横替换点号，避免 querySelector 解析异常）
      if (!node.id) {
        node.id = `thm-${conf.short.toLowerCase()}-${numStr.replace(/\./g, '-')}`;
      } else if (node.id.includes('.')) {
        node.id = node.id.replace(/\./g, '-');
      }

      // 挂载到右侧 TOC 目录
      if (tocList) {
        const li = document.createElement('li');
        li.setAttribute('data-callout-toc', 'true');
        li.className = 'nav-item callout-toc-item';

        const a = document.createElement('a');
        a.className = 'nav-link';
        a.href = `#${node.id}`;
        a.textContent = `${conf.short} ${numStr}`;
        if (subTitle) a.title = `${conf.full} ${numStr}${subTitle}`;

        // 核心：点击平滑跳转 + 自动展开折叠块
        a.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();

          const target = document.getElementById(node.id);
          if (target) {
            // 如果目标被折叠，点击时自动展开
            if (target.classList.contains('is-folded')) {
              target.classList.remove('is-folded');
            }

            // 计算避让吸顶导航栏高度
            const navbar = document.querySelector('.navbar, header.fixed-top');
            const navH = navbar ? navbar.getBoundingClientRect().height : 55;
            const targetY = target.getBoundingClientRect().top + window.pageYOffset - navH - 16;

            window.scrollTo({
              top: targetY,
              behavior: 'smooth'
            });

            // 立即清除所有项的激活态并点亮当前项
            tocList.querySelectorAll('a.nav-link').forEach(link => {
              link.classList.remove('active', 'active-math-target');
            });
            a.classList.add('active', 'active-math-target');

            if (history.pushState) {
              history.pushState(null, null, '#' + node.id);
            }
          }
        });

        li.appendChild(a);

        if (lastTocAnchor && lastTocAnchor.parentNode) {
          lastTocAnchor.parentNode.insertBefore(li, lastTocAnchor.nextSibling);
          lastTocAnchor = li;
        } else {
          tocList.appendChild(li);
          lastTocAnchor = li;
        }
      }
    });

    if (headersToTypeset.length > 0) {
      triggerMathTypeset(headersToTypeset);
    }
  }

  // 5. 处理证明环境 (.proof)
  function processProofs() {
    const proofs = document.querySelectorAll('.proof:not(.remark):not([id^="rem-"])');
    proofs.forEach(proof => {
      if (proof.dataset.mathProcessed === "true") return;
      proof.dataset.mathProcessed = "true";

      let proofLabel = "Proof.";
      const firstP = proof.querySelector('p');
      if (firstP) {
        const titleSpan = firstP.querySelector('.proof-title');
        if (titleSpan) {
          proofLabel = titleSpan.textContent.trim();
          titleSpan.remove();
        } else {
          const em = firstP.querySelector('em');
          if (em && /proof/i.test(em.textContent)) {
            proofLabel = em.textContent.trim();
            em.remove();
          }
        }
      }

      const header = document.createElement('div');
      header.className = 'proof-header';
      header.innerHTML = `<span><em>${proofLabel}</em></span>${CHEVRON_SVG}`;

      const body = document.createElement('div');
      body.className = 'proof-body';
      while (proof.firstChild) {
        body.appendChild(proof.firstChild);
      }

      proof.appendChild(header);
      proof.appendChild(body);

      // 默认折叠
      proof.classList.add('is-folded');

      header.addEventListener('click', () => {
        proof.classList.toggle('is-folded');
      });
    });
  }

  // 6. 精准滚动监听（修复原 offsetTop 跨容器错乱与一青一蓝双高亮 Bug）
  function initScrollSpy() {
    const tocList = ensureTocList();
    if (!tocList) return;

    function onScroll() {
      const targets = Array.from(document.querySelectorAll('main h2[id], main h3[id], #quarto-document-content h2[id], #quarto-document-content h3[id], .theorem[id]'));
      if (!targets.length) return;

      const threshold = 130; // 判定线：视口上方 130px
      let current = null;

      // 使用真实屏幕视口坐标 rect.top，彻底杜绝 offsetTop 的定位失效问题
      for (const el of targets) {
        const rect = el.getBoundingClientRect();
        if (rect.top <= threshold) {
          current = el;
        } else {
          break;
        }
      }

      // 处于页面最顶部时激活第一项
      if (!current && window.scrollY < 120) {
        current = targets[0];
      }

      if (current) {
        // 同时清理 active 与 active-math-target，消灭冲突
        const allLinks = tocList.querySelectorAll('a.nav-link');
        allLinks.forEach(a => {
          a.classList.remove('active', 'active-math-target');
        });

        const activeA = tocList.querySelector(`a[href="#${CSS.escape(current.id)}"]`);
        if (activeA) {
          activeA.classList.add('active', 'active-math-target');
        }
      }
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    // 初始化时执行一次判定
    setTimeout(onScroll, 100);
  }

  let hasInit = false;
  function run() {
    if (hasInit) return;
    const items = document.querySelectorAll('.theorem, [id^="def-"], [id^="lem-"], [id^="rem-"], [id^="thm-"], [id^="cor-"], [id^="prp-"], [id^="exm-"]');
    if (!items.length && document.readyState === 'loading') return;
    hasInit = true;
    processTheorems();
    processProofs();
    initScrollSpy();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
  window.addEventListener('load', run);
})();
</script>
